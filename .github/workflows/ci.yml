name: CI

# Quality gate for every push and pull request. A PR should not merge while any
# required job here is red. Protect `main` and require these checks in the repo
# settings (Settings -> Branches -> Branch protection rules).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned in ONE place and matched to .nvmrc and package.json engines. CI was
  # on 20 while local development ran 22, which is how a version-specific break
  # reaches main without anyone seeing it fail.
  NODE_VERSION: "22"

jobs:
  quality:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the lockfile is generated on Windows,
        # where npm omits the nested @emnapi/runtime dependency of Tailwind's wasm
        # fallback (@tailwindcss/oxide-wasm32-wasi) that the Linux runner resolves.
        # That cross-platform gap makes the strict `npm ci` sync check fail;
        # `npm install` reconciles the platform-specific optional deps instead.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # A required gate since the lint debt was cleared: 0 errors. Warnings
        # are triaged and deliberately not failing the build.
        run: npm run lint

      - name: Format check
        # Informational, deliberately. Making this required needs a one-time
        # `npm run format` across a codebase that predates Prettier, which would
        # rewrite nearly every file - destroying `git blame` for the whole
        # history to satisfy a gate. Worth doing as its own commit one day; not
        # worth smuggling into an unrelated change.
        run: npm run format:check
        continue-on-error: true

      - name: Unit + isolation tests
        run: npm run test:run

      - name: Build
        # The app is designed to run without external keys (canned fallbacks),
        # but Auth.js needs a secret present at build time.
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
        run: npm run build

      # Keep the build for the e2e job rather than building twice. `.next` is
      # several hundred MB of cache, so only the server output is kept.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: Integration + end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Cache Playwright browsers
        # Keyed on the Playwright version: a browser build is tied to the
        # library version, and a stale cache fails with "Executable doesn't
        # exist" rather than anything that points at the cause.
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Only Chromium. The suites do not test cross-browser rendering, and
        # three engines would triple the download for no extra signal.
        run: npx playwright install --with-deps chromium

      - name: Run integration + end-to-end suites
        # These boot a real production server via tests/e2e-setup.ts and hit it
        # over HTTP, so they catch the class of bug a unit test cannot: a route
        # that forgets to call the gate its unit test proves correct.
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
        run: npm run test:e2e

  security:
    name: Secret + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan can inspect past commits

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true # informational: review findings, do not hard-block yet
