<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Brand mark: the --logo-from / --logo-to gradient from globals.css with the
    lucide `message-square-text` glyph, matching the LogoMark component.
    Modern browsers prefer this over icon.png - it stays crisp at every size and
    is a fraction of the bytes. icon.png and favicon.ico remain for the rest.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CB0FF"/>
      <stop offset="1" stop-color="#1A91F0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="113" ry="113" fill="url(#brand)"/>
  <g transform="translate(102.4 102.4) scale(12.8)"
     fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>
    <path d="M7 11h10"/>
    <path d="M7 15h6"/>
    <path d="M7 7h8"/>
  </g>
</svg>
